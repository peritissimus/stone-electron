name: Validate and package

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      CSC_NAME:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY:
        description: Contents of the App Store Connect .p8 key (CI writes a temporary file).
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # Renderer/build dependencies also ship in bundles, so audit the full graph.
      - name: Reject high and critical dependency vulnerabilities
        run: pnpm audit --audit-level high
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Build application
        run: pnpm build
      - name: Cache retrieval evaluation models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/retrieval-eval/models
          key: ${{ runner.os }}-${{ runner.arch }}-retrieval-models-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Validate retrieval and reranking quality
        run: pnpm eval:retrieval
      - name: Build web application and server
        run: pnpm build:web-stack
      - name: Build native transcription runtime
        run: pnpm build:whisper
      - name: Package validation build
        if: ${{ !inputs.release }}
        run: pnpm exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package unsigned release
        if: ${{ inputs.release && vars.STONE_SIGNED_RELEASES != 'true' }}
        run: pnpm exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign and notarize release
        if: ${{ inputs.release && vars.STONE_SIGNED_RELEASES == 'true' }}
        shell: bash
        run: |
          api_key_path=''
          trap 'if [[ -n "$api_key_path" ]]; then rm -f "$api_key_path"; fi' EXIT
          if [[ -n "$APPLE_API_KEY" ]]; then
            api_key_path=$(mktemp "$RUNNER_TEMP/stone-notarization.XXXXXX")
            chmod 600 "$api_key_path"
            printf '%s' "$APPLE_API_KEY" > "$api_key_path"
            export APPLE_API_KEY="$api_key_path"
          fi
          pnpm package:signed
        env:
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Locate packaged application
        shell: bash
        run: |
          binary=$(find dist/build -path '*/Stone.app/Contents/MacOS/Stone' -type f -print -quit)
          test -n "$binary"
          echo "STONE_E2E_BINARY=$PWD/$binary" >> "$GITHUB_ENV"
          echo "STONE_PACKAGED_APP=$PWD/${binary%/Contents/MacOS/Stone}" >> "$GITHUB_ENV"
      - name: Verify release signature and notarization
        if: ${{ inputs.release && vars.STONE_SIGNED_RELEASES == 'true' }}
        run: |
          codesign --verify --deep --strict "$STONE_PACKAGED_APP"
          xcrun stapler validate "$STONE_PACKAGED_APP"
      - name: Verify packaged runtime imports
        run: node scripts/verify-packaged-runtime.cjs
      - name: Packaged application smoke test
        run: pnpm exec playwright test tests/e2e/releaseSmoke.spec.ts
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Store verified release artifacts
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stone-macos
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/build/*.dmg
            dist/build/*.zip
            dist/build/*.blockmap
