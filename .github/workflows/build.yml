name: Build and Test

on:
  push:
    branches: [main, develop, feature/**, feat/**]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  # Preserve the existing required status-check name for branch protection.
  build:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
